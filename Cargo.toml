[workspace]
members = [
    "crates/bbt",
    "crates/bbt-agent",
    "crates/bbt-cli",
    "crates/bbt-core",
    "crates/bbt-disk",
    "crates/bbt-fs",
    "crates/bbt-host",
    "crates/bbt-net",
    "crates/bbt-proc",
    "crates/bbt-service",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/akinteldev/better-basic-tools"
rust-version = "1.76"
authors = ["Adrian Kessler"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
