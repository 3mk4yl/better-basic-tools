name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin bbt
      - name: Package archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          pkg="bbt-${version}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}"
          cp "target/${{ matrix.target }}/release/bbt" "dist/${pkg}/"
          cp README.md LICENSE SECURITY.md "dist/${pkg}/"
          cp -r schemas "dist/${pkg}/schemas"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          (cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
